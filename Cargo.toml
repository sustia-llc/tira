[package]
name = "one_many_rs"
version = "0.1.0"
edition = "2024"

[dependencies]
nalgebra = "0.35"
rand = { version = "0.10", features = ["sys_rng", "thread_rng"] }
rand_distr = "0.6"
thiserror = "2"
serde = { version = "1.0", features = ["derive"] }
plotters = "0.3"
flume = "0.12"
rayon = "1.10"

[dev-dependencies]
approx = "0.5"

[[bin]]
name = "reproduce"
path = "src/bin/reproduce.rs"
