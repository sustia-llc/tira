[workspace]
resolver = "3"
members = ["crates/aif", "crates/reproduce"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sustia-llc/tira"
# Declared floor 1.93.0, aligned with koalisi's declaration (owner, 2026-09-28).
# Edition 2024 means resolver 3, so this value also bounds dependency resolution.
# The gate verifies the declaration itself:
# `cargo +1.93.0 check --all-targets --locked --features <set>` on the feature
# sets a PR's dependency or source change reaches. Never
# `--ignore-rust-version`: it also suppresses the dependency checks.
# Historical record, last measured at `aif-v0.14.0` (2026-09-16) and no longer
# re-measured — the floor below the declaration:
#   1.89  `aif` default, `aif --features serde`, `aif --features communication`,
#         and the whole workspace with `--all-targets`
#         (1.88 fails on the dependency floor: nalgebra 0.35 / safe_arch 1.0 /
#         wide 1.4 declare 1.89)
rust-version = "1.93.0"

[workspace.dependencies]
nalgebra = "0.35"
rand = { version = "0.10", features = ["sys_rng", "thread_rng"] }
rand_distr = "0.6"
thiserror = "2"
serde = { version = "1.0", features = ["derive"] }
flume = "0.12"
plotters = "0.3"
rayon = "1.10"
approx = "0.5"
