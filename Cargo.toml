[workspace]
resolver = "3"
members = ["crates/aif", "crates/reproduce"]

[workspace.dependencies]
nalgebra = "0.35"
rand = { version = "0.10", features = ["sys_rng", "thread_rng"] }
rand_distr = "0.6"
thiserror = "2"
serde = { version = "1.0", features = ["derive"] }
flume = "0.12"
plotters = "0.3"
rayon = "1.10"
approx = "0.5"
