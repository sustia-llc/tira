[package]
name = "aif"
version = "0.14.0"
edition.workspace = true
rust-version.workspace = true
description = "Active-inference engine: POMDP agents, Markov-blanket group composition, and coalition-value primitives (Waade et al., Entropy 2025)"
license.workspace = true
repository.workspace = true

[dependencies]
nalgebra = { workspace = true }
rand = { workspace = true }
rand_distr = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true, optional = true }
flume = { workspace = true, optional = true }

[features]
# Every `serde` derive site in this crate is on a `communication` type, so `serde`
# without `communication` would compile serde + serde_derive for zero effect and expose
# no serializable types at all. It therefore implies `communication`.
serde = ["dep:serde", "communication"]
# Message transport (`communication.rs`): the optional carrier for a message-passing
# variant of extension 6. Default-off since issue #5 — the shipped topology routing
# (`topology.rs`, #46) is channel-free and lives in the default build, so downstream
# consumers do not carry `flume`.
communication = ["dep:flume"]

[dev-dependencies]
approx = { workspace = true }
