[package]
name = "reproduce"
version = "0.5.0"
edition = "2024"
description = "Paper-reproduction harness for the aif active-inference engine"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sustia-llc/tira"
publish = false

[dependencies]
aif = { path = "../aif" }
nalgebra = { workspace = true }
rand = { workspace = true }
rand_distr = { workspace = true }
serde = { workspace = true }
plotters = { workspace = true }
rayon = { workspace = true }

[dev-dependencies]
approx = { workspace = true }

[[bin]]
name = "reproduce"
path = "src/bin/reproduce.rs"
